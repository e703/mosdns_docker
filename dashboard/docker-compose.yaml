# version: '3.8'

volumes:
  logs:
  prometheus_data:
  grafana_data:
  vector_data:
  loki_data:

networks:
  loki:

services:
  adguardhome:
    container_name: adguardhome
    image: adguard/adguardhome:latest
    volumes:
      - ./adguardhome/workdir:/opt/adguardhome/work
      - ./adguardhome/confdir:/opt/adguardhome/conf
    restart: always
    network_mode: host

  mosdns:
    container_name: mosdns
    build:
      context: ./mosdns/docker
    image: mosdns_unofficial:latest
    volumes:
      - ./mosdns/config:/etc/mosdns
      - logs:/var/log
    restart: always
#    network_mode: host
    ports:
      - 6553:6553/udp
      - 6553:6553
    networks:
       - loki

  vector:
    container_name: vector
    image: timberio/vector:latest-alpine
    volumes:
      - ./vector/config.yml:/etc/vector/vector.yaml
      - logs:/var/log
      - vector_data:/tmp/vector
    restart: always
#    network_mode: host
    networks:
      - loki

  prometheus:
    container_name: prometheus
    image: prom/prometheus:latest
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    restart: always
#    network_mode: host
    ports:
      - 9090:9090
    networks:
      - loki

  loki:
    container_name: loki
    image: grafana/loki:2.9.2
    user: "0:0" # 以 root 运行，解决 loki_data volume 权限问题
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/local-config.yaml
      - loki_data:/tmp/loki
    # ports:
    #   - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    restart: always
#    network_mode: host
    networks:
      - loki

  grafana:
    container_name: grafana
    volumes:
      - grafana_data:/var/lib/grafana
    environment:
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    entrypoint:
      - sh
      - -euc
      - |
        mkdir -p /etc/grafana/provisioning/datasources
        cat <<EOF > /etc/grafana/provisioning/datasources/ds.yaml
        apiVersion: 1
        datasources:
        - name: Loki
          type: loki
          access: proxy 
          orgId: 1
          url: http://loki:3100
          basicAuth: false
          isDefault: true
          version: 1
          editable: false
        EOF
        /run.sh
    image: grafana/grafana:latest
    restart: always
    ports:
      - "3000:3000"
    networks:
      - loki
